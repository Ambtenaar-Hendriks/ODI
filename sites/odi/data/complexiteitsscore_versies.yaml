# Versiegeschiedenis van de Complexiteitsscore, nieuwste bovenaan.
# Voeg bij elke inhoudelijke wijziging van de tool een versie toe. De pagina
# toont de bovenste als huidige versie, met een label "Vernieuwd" tot 30
# dagen na de datum. Zet een regel met een dubbele punt erin tussen
# aanhalingstekens, anders leest YAML hem verkeerd.
- versie: "1.1"
  datum: 2026-10-21
  wijzigingen:
    - Onder de tabel staat een duiding van de totaalscore, met aandachtspunten en een verwijzing naar de IPMA-certificering. De duiding gaat mee in de exports.
    - Het toelichtingveld is een tekstvak dat meegroeit met de tekst.
    - De schuifregelaar is te bedienen met het toetsenbord (pijltjes per score, Home en End) en wordt goed voorgelezen door een schermlezer. Het bolletje staat precies onder het gekozen cijfer.
    - De toelichting per score (ℹ️) is een knop die ook met het toetsenbord werkt, en blijft zichtbaar nadat je een score kiest.
    - Kleuren volgen de lichte of donkere weergave van de site.
    - Auto-opslaan onthoudt de instelling en bewaart één versie die alleen bij wijzigingen wordt bijgewerkt.
    - Versienamen en toelichtingen worden veilig getoond, ook als ze tekens als < of & bevatten.
    - De naam is overal "Complexiteitsscore", ook in de exports en de bestandsnamen van downloads.
    - "Opgelost: helemaal naar rechts slepen gaf een score van 5."
    - "Opgelost: de link naar de IPMA-invulinstructie werkte niet."
- versie: "1.0"
  datum: 2026-09-07
  wijzigingen:
    - Eerste versie van de Complexiteitsscore, met tien dimensies op basis van de IPMA-classificatie, opslaan in de browser en export naar CSV, Markdown en PDF.
