baseURL: https://ambtenaar-hendriks.github.io/ODI
title: ODI Startpagina
defaultContentLanguage: nl

params:
  # Eén plek voor de repo-URL, zodat links in de content niet verouderen.
  repo: https://github.com/Ambtenaar-Hendriks/ODI

  # Deze site is een experimenteerkopie; de balk maakt dat zichtbaar voor
  # bezoekers. Weglaten laat de balk verdwijnen. De balk is één regel met
  # ellipsis, dus de tekst moet kort blijven.
  statusmelding:
    variant: warning
    tekst: Probeersel op persoonlijke titel - geen officiële uiting van ODI
  tagline: Rijksorganisatie voor Ontwikkeling, Digitalisering en Innovatie
  description: Een plek voor persoonlijke probeersels.

 
# Zie sites/kennisbank-pm/hugo.yaml: de vormgeving komt uit ../../gedeeld.
module:
  mounts:
    - source: content
      target: content
    - source: data
      target: data
    - source: layouts
      target: layouts
    - source: ../../gedeeld/layouts
      target: layouts
    - source: ../../gedeeld/assets
      target: assets
    - source: ../../gedeeld/static
      target: static


enableRobotsTXT: true

security:
  allowContent:
    - ^text/markdown$
    - ^text/html$

markup:
  goldmark:
    renderer:
      unsafe: true

# Expertises en Kennisbronnen staan al als blok op de homepage en in de
# footer; in de balk zouden ze dat dubbelop doen.
menus:
  main:
    - name: Home
      pageRef: /
      weight: 1
    - name: Complexiteitsscore
      pageRef: /complexiteitsscore
      weight: 2

  footer-rechts:
    - name: Over deze site
      pageRef: /over
      weight: 1

outputs:
  home:
    - HTML
    - JSON
